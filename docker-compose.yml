services:
  raglens:
    build: .
    ports:
      - "127.0.0.1:4177:4177"
    environment:
      RAGLENS_HOST: 0.0.0.0
      RAGLENS_ALLOWED_HOSTS: ${RAGLENS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      RAGLENS_PORT: 4177
      RAGLENS_DATA_DIR: /data
      RAGLENS_STORAGE_DRIVER: ${RAGLENS_STORAGE_DRIVER:-json}
      RAGLENS_DATABASE_URL: ${RAGLENS_DATABASE_URL:-}
      RAGLENS_DATABASE_POOL_MAX: ${RAGLENS_DATABASE_POOL_MAX:-5}
      RAGLENS_DATABASE_SSL: ${RAGLENS_DATABASE_SSL:-false}
      RAGLENS_ALLOW_INSECURE_DATABASE_SSL: ${RAGLENS_ALLOW_INSECURE_DATABASE_SSL:-false}
      RAGLENS_AUTO_SEED: ${RAGLENS_AUTO_SEED:-true}
      RAGLENS_ADMIN_TOKEN: ${RAGLENS_ADMIN_TOKEN:?set RAGLENS_ADMIN_TOKEN before running docker compose}
      RAGLENS_ALLOW_UNSAFE_PROVIDER_HTTP: ${RAGLENS_ALLOW_UNSAFE_PROVIDER_HTTP:-false}
      RAGLENS_ALLOW_UNSAFE_OTEL_HTTP: ${RAGLENS_ALLOW_UNSAFE_OTEL_HTTP:-false}
      RAGLENS_OPENAI_API_KEY: ${RAGLENS_OPENAI_API_KEY:-}
      RAGLENS_OPENAI_BASE_URL: ${RAGLENS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      RAGLENS_OPENAI_MODEL: ${RAGLENS_OPENAI_MODEL:-gpt-4.1-mini}
      RAGLENS_OPENAI_TIMEOUT_MS: ${RAGLENS_OPENAI_TIMEOUT_MS:-30000}
      RAGLENS_COST_INPUT_USD_PER_1M: ${RAGLENS_COST_INPUT_USD_PER_1M:-0}
      RAGLENS_COST_OUTPUT_USD_PER_1M: ${RAGLENS_COST_OUTPUT_USD_PER_1M:-0}
      RAGLENS_OTEL_EXPORT_URL: ${RAGLENS_OTEL_EXPORT_URL:-}
      RAGLENS_OTEL_SERVICE_NAME: ${RAGLENS_OTEL_SERVICE_NAME:-raglens}
      RAGLENS_OTEL_TIMEOUT_MS: ${RAGLENS_OTEL_TIMEOUT_MS:-5000}
      RAGLENS_OTEL_HEADERS: ${RAGLENS_OTEL_HEADERS:-}
      RAGLENS_OTEL_INCLUDE_CONTENT: ${RAGLENS_OTEL_INCLUDE_CONTENT:-false}
      RAGLENS_PDF_TEXT_COMMAND: ${RAGLENS_PDF_TEXT_COMMAND:-}
      RAGLENS_PDF_TEXT_ARGS: ${RAGLENS_PDF_TEXT_ARGS:-}
      RAGLENS_PDF_TEXT_TIMEOUT_MS: ${RAGLENS_PDF_TEXT_TIMEOUT_MS:-10000}
    volumes:
      - raglens-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

volumes:
  raglens-data:
